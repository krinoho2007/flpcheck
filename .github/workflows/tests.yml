name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows only: the suite asserts on Windows-style absolute paths and the
    # POSIX pattern deliberately matches /Users, /Volumes and /home rather
    # than any absolute path, so a Linux runner would fail on path handling
    # that is not what this tool does.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v
